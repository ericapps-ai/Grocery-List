<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thyme to Shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#F2EEE1;
    --paper:#FBF8F0;
    --ink:#26301F;
    --ink-soft:#5B6152;
    --pine:#2E4034;
    --pine-light:#436153;
    --mustard:#C89B3C;
    --mustard-light:#E9D6A8;
    --berry:#A33B44;
    --line:#D9D3BF;
    --radius:14px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }

  header{
    padding:28px 20px 16px;
    border-bottom:1px solid var(--line);
  }

  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    color:var(--pine);
    letter-spacing:-0.01em;
  }

  header p.sub{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }

  main{
    flex:1;
    padding:16px 20px 100px;
    overflow-y:auto;
  }

  nav.tabbar{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:var(--paper);
    border-top:1px solid var(--line);
    max-width:480px;
    margin:0 auto;
  }

  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    padding:14px 0 10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  nav.tabbar button.active{ color:var(--pine); }

  nav.tabbar button svg{ width:20px; height:20px; }

  button.primary{
    background:var(--pine);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:12px 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  button.primary:active{ transform:scale(0.97); }

  button.ghost{
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:999px;
    padding:10px 16px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  button.text-link{
    background:none;
    border:none;
    color:var(--pine);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    padding:6px 4px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty svg{ width:40px; height:40px; opacity:0.5; margin-bottom:12px; }
  .empty h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--pine);
    margin:0 0 6px;
    font-size:18px;
  }
  .empty p{ margin:0 0 18px; font-size:14px; }

  .category-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
  }
  .category-card:active{ background:#F5F1E6; }
  .category-card .cat-icon{
    width:46px;
    height:46px;
    border-radius:12px;
    background:var(--mustard-light);
    color:#5A4114;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .category-card .cat-icon svg{ width:24px; height:24px; }
  .category-card .cat-body{ flex:1; }
  .category-card .cat-body h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 3px;
    color:var(--ink);
  }
  .category-card .cat-body p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .category-card .chevron{
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .category-card .chevron svg{ width:18px; height:18px; }

  .recipe-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  .recipe-card:active{ background:#F5F1E6; }

  .recipe-card .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    margin:0 0 3px;
  }
  .recipe-card .count{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .recipe-card .icon-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    padding:6px;
    cursor:pointer;
  }

  .section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--pine);
    margin:22px 0 10px;
  }
  .section-title:first-child{ margin-top:0; }

  input[type=text], select{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  input[type=text]:focus, select:focus{
    outline:none;
    border-color:var(--pine-light);
  }

  label.field-label{
    display:block;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .field{ margin-bottom:18px; }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .chip{
    background:var(--mustard-light);
    color:#5A4114;
    padding:7px 8px 7px 13px;
    border-radius:999px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip button{
    background:none;
    border:none;
    color:#5A4114;
    cursor:pointer;
    display:flex;
    padding:2px;
  }

  .ingredient-entry{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
  }
  .ingredient-entry .row1{
    margin-bottom:8px;
  }
  .ingredient-entry .row2{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .ingredient-entry .row2 input{ flex:1; }
  .ingredient-entry .row2 select{ flex:1.3; }

  button.add-full{
    align-self:flex-end;
    background:var(--pine);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 16px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  button.add-full svg{ width:14px; height:14px; }

  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .back-btn{
    background:none;
    border:none;
    color:var(--pine);
    display:flex;
    align-items:center;
    gap:4px;
    font-weight:500;
    font-size:14px;
    cursor:pointer;
    padding:4px 0;
  }

  .review-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .review-item:last-child{ border-bottom:none; }

  .check{
    width:22px;
    height:22px;
    border-radius:6px;
    border:1.5px solid var(--pine-light);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    background:var(--paper);
  }
  .check.checked{
    background:var(--pine);
    border-color:var(--pine);
  }
  .check svg{ width:14px; height:14px; stroke:#fff; opacity:0; }
  .check.checked svg{ opacity:1; }

  .review-item .label{
    font-size:15px;
    flex:1;
  }
  .review-item.checked-off .label{
    color:var(--ink-soft);
    text-decoration:line-through;
  }

  .cat-group{ margin-bottom:24px; }
  .cat-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .cat-header svg{ width:16px; height:16px; color:var(--pine); }
  .cat-header span{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--pine);
  }
  .cat-header .n{
    font-size:12px;
    color:var(--ink-soft);
    margin-left:auto;
  }

  .list-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-bottom:1px dashed var(--line);
  }
  .list-item .label{
    flex:1;
    font-size:15px;
    color:var(--ink);
  }
  .list-item.checked .label{
    color:var(--ink-soft);
    text-decoration:line-through;
  }
  .list-item .del{
    background:none;
    border:none;
    color:var(--ink-soft);
    padding:4px;
    cursor:pointer;
  }
  .list-item .src{
    font-size:11px;
    color:var(--ink-soft);
    background:var(--bg);
    padding:2px 7px;
    border-radius:999px;
    flex-shrink:0;
  }

  .adhoc-form{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:20px;
  }
  .adhoc-form .row{ display:flex; gap:8px; }
  .adhoc-form select{ width:130px; flex-shrink:0; }

  .list-footer{
    display:flex;
    gap:10px;
    margin-top:8px;
  }

  .import-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:6px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }

  .import-banner{
    background:var(--mustard-light);
    color:#5A4114;
    padding:12px 14px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    font-size:13px;
  }
  .import-banner button{
    background:none;
    border:none;
    color:#5A4114;
    cursor:pointer;
    display:flex;
    padding:2px;
    flex-shrink:0;
  }

  .modal-veil{
    position:fixed;
    inset:0;
    background:rgba(38,48,31,0.35);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:20;
  }
  .modal{
    background:var(--paper);
    width:100%;
    max-width:480px;
    border-radius:20px 20px 0 0;
    padding:22px 20px 28px;
  }
  .modal h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 16px;
    color:var(--pine);
  }
  .modal .actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .modal .actions button{ flex:1; justify-content:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS = {
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 11.5a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  chevronLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
  chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-.8 13.4A2 2 0 0 1 15.2 21H8.8a2 2 0 0 1-2-1.6L6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  carrot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 12c3-5 7-7 9-6-1 2-3 5-6 6"/><path d="M12 12C7 9 4 12 3 15c4 3 8 3 9-1 1-3-1-6-3-8Z"/><path d="M9 4l1.5 1.5M12 3l1 2M15 4.5 14 6"/></svg>',
  spray: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 22h4a1 1 0 0 0 1-1v-9H8v9a1 1 0 0 0 1 1Z"/><path d="M8 12V9a2 2 0 0 1 2-2h1V5h2v2h.5L15 5"/><path d="M17 4l2-1M18 7h2.5M17 10l2 1"/></svg>',
  droplet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>'
};

const UNITS = [
  { id:'', label:'No unit' },
  { id:'lb', label:'lb' },
  { id:'oz', label:'oz' },
  { id:'g', label:'g' },
  { id:'kg', label:'kg' },
  { id:'cup', label:'cup' },
  { id:'tbsp', label:'tbsp' },
  { id:'tsp', label:'tsp' },
  { id:'ml', label:'ml' },
  { id:'l', label:'l' },
  { id:'fl_oz', label:'fl oz' },
  { id:'pinch', label:'pinch' },
  { id:'clove', label:'clove' },
  { id:'whole', label:'whole' },
  { id:'roll', label:'roll' },
  { id:'bottle', label:'bottle' },
  { id:'pack', label:'pack' },
  { id:'box', label:'box' },
  { id:'pair', label:'pair' }
];

const CATEGORIES = [
  { id:'food', listLabel:'Food', recipeLabel:'Dishes', recipeDesc:'Recipes and their ingredients', icon: ICONS.carrot },
  { id:'cleaning', listLabel:'Cleaning', recipeLabel:'Cleaning', recipeDesc:'Cleaning supply lists', icon: ICONS.spray },
  { id:'toiletries', listLabel:'Toiletries', recipeLabel:'Toiletries', recipeDesc:'Personal care lists', icon: ICONS.droplet }
];

function catById(id){ return CATEGORIES.find(c => c.id === id); }

function normalizeCategory(raw){
  const v = (raw||'').trim().toLowerCase();
  if(['food','dish','dishes','recipe','recipes'].includes(v)) return 'food';
  if(['cleaning','clean'].includes(v)) return 'cleaning';
  if(['toiletries','toiletry','personal care','personal-care'].includes(v)) return 'toiletries';
  return null;
}

let state = {
  tab: 'lists',
  view: 'category-home',
  recipes: [],
  list: [],
  currentCategory: null,
  editingRecipeId: null,
  formName: '',
  formIngredients: [],
  reviewRecipeId: null,
  reviewSelections: {},
  showClearAllModal: false,
  deleteConfirmRecipeId: null,
  importGroups: null,
  importSkipped: 0,
  importError: null,
  lastImportSummary: null,
  loaded: false
};

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

async function loadData(){
  try{
    const r = await window.storage.get('recipes', false);
    if(r){
      state.recipes = JSON.parse(r.value);
    } else {
      let legacy = [];
      try{
        const d = await window.storage.get('dishes', false);
        legacy = d ? JSON.parse(d.value) : [];
      }catch(e){ legacy = []; }
      state.recipes = legacy.map(dish => ({
        id: dish.id || uid(),
        name: dish.name,
        category: 'food',
        ingredients: (dish.ingredients||[]).map(ing =>
          typeof ing === 'string' ? { name: ing, amount:'', unit:'' } : ing
        )
      }));
      if(state.recipes.length) await saveRecipes();
    }
    state.recipes.forEach(rec => {
      rec.ingredients = (rec.ingredients||[]).map(ing =>
        typeof ing === 'string' ? { name: ing, amount:'', unit:'' } : ing
      );
      if(!rec.category) rec.category = 'food';
    });
  }catch(e){ state.recipes = []; }
  try{
    const l = await window.storage.get('groceryList', false);
    state.list = l ? JSON.parse(l.value) : [];
  }catch(e){ state.list = []; }
  state.loaded = true;
  render();
}

async function saveRecipes(){
  try{ await window.storage.set('recipes', JSON.stringify(state.recipes), false); }
  catch(e){ console.error('save recipes failed', e); }
}
async function saveList(){
  try{ await window.storage.set('groceryList', JSON.stringify(state.list), false); }
  catch(e){ console.error('save list failed', e); }
}

function go(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);
  render();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatQty(ing){
  const amt = (ing.amount||'').toString().trim();
  const unit = ing.unit || '';
  if(!amt) return '';
  const unitLabel = UNITS.find(u => u.id === unit);
  const unitText = unit && unitLabel ? (unit === 'whole' ? '' : ' ' + unitLabel.label) : '';
  return `${amt}${unitText} `;
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:14px;">Loading...</div>';
    return;
  }
  let body = '';
  let subtitle = 'What to shop for';
  if(state.view === 'category-home'){ body = renderCategoryHome(); subtitle = 'Pick a kind of list'; }
  else if(state.view === 'recipe-list'){ body = renderRecipeList(); subtitle = catById(state.currentCategory).recipeLabel; }
  else if(state.view === 'recipe-form'){ body = renderRecipeForm(); subtitle = catById(state.currentCategory).recipeLabel; }
  else if(state.view === 'review-recipe'){ body = renderReview(); subtitle = 'Choose what to add'; }
  else if(state.view === 'list-home'){ body = renderListHome(); subtitle = 'What to pick up'; }
  else if(state.view === 'import-preview'){ body = renderImportPreview(); subtitle = 'Import from CSV'; }

  app.innerHTML = `
    <header>
      <h1>Thyme to Shop</h1>
      <p class="sub">${subtitle}</p>
    </header>
    <main id="main">${body}</main>
    <nav class="tabbar">
      <button class="${state.tab==='lists'?'active':''}" onclick="switchTab('lists')">
        ${ICONS.book}<span>Lists</span>
      </button>
      <button class="${state.tab==='grocery'?'active':''}" onclick="switchTab('grocery')">
        ${ICONS.cart}<span>Grocery list</span>
      </button>
    </nav>
  `;
  attachHandlers();
}

function switchTab(tab){
  state.tab = tab;
  state.view = tab === 'lists' ? 'category-home' : 'list-home';
  render();
}

function renderCategoryHome(){
  const cards = CATEGORIES.map(cat => {
    const count = state.recipes.filter(r => r.category === cat.id).length;
    return `
      <div class="category-card" onclick="openCategory('${cat.id}')">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-body">
          <h3>${cat.recipeLabel}</h3>
          <p>${cat.recipeDesc} &middot; ${count} saved</p>
        </div>
        <div class="chevron">${ICONS.chevronRight}</div>
      </div>
    `;
  }).join('');

  const banner = state.lastImportSummary ? `
    <div class="import-banner">
      <span>${escapeHtml(state.lastImportSummary)}</span>
      <button onclick="dismissImportSummary()" aria-label="Dismiss">${ICONS.x}</button>
    </div>
  ` : '';

  return `
    ${banner}
    ${cards}
    <div class="import-row">
      <button class="ghost" onclick="triggerCsvFile()">${ICONS.upload} Import CSV</button>
      <button class="text-link" onclick="downloadTemplate()">Download template</button>
    </div>
    <input type="file" id="csvFileInput" accept=".csv" style="display:none">
  `;
}

function openCategory(catId){
  go('recipe-list', { currentCategory: catId });
}

function renderRecipeList(){
  const cat = catById(state.currentCategory);
  const recipes = state.recipes.filter(r => r.category === cat.id);
  const addLabel = cat.id === 'food' ? 'Add a dish' : `Add a ${cat.recipeLabel.toLowerCase()} list`;

  const topRow = `
    <div class="top-row">
      <button class="back-btn" onclick="go('category-home')">${ICONS.chevronLeft} Lists</button>
    </div>
  `;

  if(recipes.length === 0){
    return `
      ${topRow}
      <div class="empty">
        ${cat.icon}
        <h3>No ${cat.recipeLabel.toLowerCase()} yet</h3>
        <p>Add one and its ingredients once, then reuse it whenever you need to shop for it.</p>
        <button class="primary" onclick="startNewRecipe()">${ICONS.plus} ${addLabel}</button>
      </div>
    `;
  }

  const cards = recipes.map(r => `
    <div class="recipe-card" data-id="${r.id}">
      <div onclick="openReview('${r.id}')" style="flex:1;">
        <p class="name">${escapeHtml(r.name)}</p>
        <p class="count">${r.ingredients.length} item${r.ingredients.length===1?'':'s'}</p>
      </div>
      <button class="icon-btn" onclick="editRecipe('${r.id}')" aria-label="Edit">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="icon-btn" style="color:var(--berry)" onclick="confirmDeleteRecipe('${r.id}')" aria-label="Delete">${ICONS.trash}</button>
    </div>
  `).join('');

  return `
    ${topRow}
    <div style="margin-bottom:16px;">
      <button class="primary" onclick="startNewRecipe()">${ICONS.plus} ${addLabel}</button>
    </div>
    ${cards}
    ${state.deleteConfirmRecipeId ? renderDeleteRecipeModal() : ''}
  `;
}

function renderDeleteRecipeModal(){
  const recipe = state.recipes.find(r => r.id === state.deleteConfirmRecipeId);
  const name = recipe ? recipe.name : 'this list';
  return `
    <div class="modal-veil" onclick="if(event.target===this) closeDeleteRecipeModal()">
      <div class="modal">
        <h3>Delete "${escapeHtml(name)}"?</h3>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 4px;">This only removes the saved list — anything already on your grocery list stays put.</p>
        <div class="actions">
          <button class="ghost" onclick="closeDeleteRecipeModal()">Cancel</button>
          <button class="primary" style="background:var(--berry);justify-content:center;" onclick="deleteRecipe('${state.deleteConfirmRecipeId}')">Delete</button>
        </div>
      </div>
    </div>
  `;
}

function startNewRecipe(){
  go('recipe-form', { editingRecipeId:null, formName:'', formIngredients:[] });
}

function renderRecipeForm(){
  const cat = catById(state.currentCategory);
  const editing = !!state.editingRecipeId;
  const ingredients = state.formIngredients || [];
  const namePlaceholder = cat.id === 'food' ? 'Chicken piccata' : (cat.id === 'cleaning' ? 'Weekly bathroom clean' : 'Monthly restock');
  const nameFieldLabel = cat.id === 'food' ? 'Dish name' : 'List name';
  const itemFieldLabel = cat.id === 'food' ? 'Ingredients' : 'Items';
  const itemPlaceholder = cat.id === 'food' ? 'Capers' : (cat.id === 'cleaning' ? 'All-purpose cleaner' : 'Shampoo');

  const chips = ingredients.map((ing,i) => `
    <span class="chip">${escapeHtml(formatQty(ing))}${escapeHtml(ing.name)}<button onclick="removeFormIngredient(${i})" aria-label="Remove">${ICONS.x}</button></span>
  `).join('');

  return `
    <div class="top-row">
      <button class="back-btn" onclick="cancelRecipeForm()">${ICONS.chevronLeft} ${cat.recipeLabel}</button>
      ${editing ? `<button class="icon-btn" style="color:var(--berry)" onclick="confirmDeleteRecipe('${state.editingRecipeId}')">${ICONS.trash}</button>` : ''}
    </div>
    <div class="field">
      <label class="field-label">${nameFieldLabel}</label>
      <input type="text" id="recipeNameInput" placeholder="${namePlaceholder}" value="${escapeHtml(state.formName||'')}">
    </div>
    <div class="field">
      <label class="field-label">${itemFieldLabel}</label>
      <div class="ingredient-entry">
        <div class="row1">
          <input type="text" id="ingredientInput" placeholder="${itemPlaceholder}">
        </div>
        <div class="row2">
          <input type="text" id="ingredientAmount" placeholder="Amount (2, 1/2...)">
          <select id="ingredientUnit">
            ${UNITS.map(u => `<option value="${u.id}">${u.label}</option>`).join('')}
          </select>
        </div>
        <button class="add-full" onclick="addFormIngredient()">${ICONS.plus} Add</button>
      </div>
      <div class="chip-row">${chips || '<span style="font-size:13px;color:var(--ink-soft)">Nothing added yet.</span>'}</div>
    </div>
    <button class="primary" style="width:100%;justify-content:center;margin-top:8px;" onclick="saveRecipeForm()">Save</button>
    ${state.deleteConfirmRecipeId ? renderDeleteRecipeModal() : ''}
  `;
}

function renderReview(){
  const recipe = state.recipes.find(r => r.id === state.reviewRecipeId);
  if(!recipe) return '<p>Not found.</p>';
  const cat = catById(recipe.category);
  const items = recipe.ingredients.map((ing,i) => {
    const checked = state.reviewSelections[i] !== false;
    return `
      <div class="review-item ${checked?'':'checked-off'}">
        <div class="check ${checked?'checked':''}" onclick="toggleReviewItem(${i})">${ICONS.check}</div>
        <span class="label">${escapeHtml(formatQty(ing))}${escapeHtml(ing.name)}</span>
      </div>
    `;
  }).join('');
  const selectedCount = recipe.ingredients.filter((_,i)=>state.reviewSelections[i]!==false).length;
  return `
    <div class="top-row">
      <button class="back-btn" onclick="go('recipe-list',{currentCategory:recipe.category})">${ICONS.chevronLeft} ${cat.recipeLabel}</button>
    </div>
    <p class="section-title" style="margin-top:0;">${escapeHtml(recipe.name)}</p>
    <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 6px;">Uncheck anything you already have.</p>
    ${items}
    <button class="primary" style="width:100%;justify-content:center;margin-top:20px;" onclick="addReviewToList()">
      Add ${selectedCount} to grocery list
    </button>
  `;
}

function renderListHome(){
  const groups = CATEGORIES.map(cat => {
    const items = state.list.filter(it => it.category === cat.id);
    if(items.length === 0) return '';
    const rows = items.map(it => `
      <div class="list-item ${it.checked?'checked':''}">
        <div class="check ${it.checked?'checked':''}" onclick="toggleListItem('${it.id}')">${ICONS.check}</div>
        <span class="label">${escapeHtml(it.qtyText||'')}${escapeHtml(it.name)}</span>
        ${it.source==='recipe' ? `<span class="src">${escapeHtml(it.recipeName||'')}</span>` : ''}
        <button class="del" onclick="removeListItem('${it.id}')" aria-label="Remove">${ICONS.x}</button>
      </div>
    `).join('');
    return `
      <div class="cat-group">
        <div class="cat-header">${cat.icon}<span>${cat.listLabel}</span><span class="n">${items.length}</span></div>
        ${rows}
      </div>
    `;
  }).join('');

  const hasItems = state.list.length > 0;
  const hasChecked = state.list.some(it => it.checked);

  return `
    <div class="adhoc-form">
      <label class="field-label">Add an item not tied to a list</label>
      <div class="row">
        <input type="text" id="adhocName" placeholder="Paper towels">
        <select id="adhocCategory">
          ${CATEGORIES.map(c => `<option value="${c.id}">${c.listLabel}</option>`).join('')}
        </select>
        <button class="primary" style="padding:0 14px;" onclick="addAdhocItem()">${ICONS.plus}</button>
      </div>
    </div>
    ${hasItems ? groups : `
      <div class="empty">
        ${ICONS.cart}
        <h3>Your list is empty</h3>
        <p>Add items from a saved list, or drop in a one-off item above.</p>
      </div>
    `}
    ${hasItems ? `
      <div class="list-footer">
        ${hasChecked ? '<button class="ghost" onclick="clearChecked()">Clear checked</button>' : ''}
        <button class="ghost" onclick="clearAllConfirm()">Clear list</button>
      </div>
    ` : ''}
    ${state.showClearAllModal ? renderClearAllModal() : ''}
  `;
}

function renderClearAllModal(){
  return `
    <div class="modal-veil" onclick="if(event.target===this) closeClearAllModal()">
      <div class="modal">
        <h3>Clear the whole list?</h3>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 4px;">This removes every item, checked or not.</p>
        <div class="actions">
          <button class="ghost" onclick="closeClearAllModal()">Cancel</button>
          <button class="primary" style="background:var(--berry);justify-content:center;" onclick="clearAllList()">Clear list</button>
        </div>
      </div>
    </div>
  `;
}

function renderImportPreview(){
  if(state.importError){
    return `
      <div class="top-row"><button class="back-btn" onclick="cancelImport()">${ICONS.chevronLeft} Lists</button></div>
      <div class="empty">
        <h3>Import problem</h3>
        <p>${escapeHtml(state.importError)}</p>
        <button class="primary" onclick="cancelImport()">Back to Lists</button>
      </div>
    `;
  }
  const groups = state.importGroups || [];
  const rows = groups.map(g => {
    const cat = catById(g.category);
    return `
      <div class="recipe-card" style="cursor:default;">
        <div style="flex:1;">
          <p class="name">${escapeHtml(g.name)}</p>
          <p class="count">${cat.recipeLabel} &middot; ${g.items.length} item${g.items.length===1?'':'s'} &middot; ${g.isNew ? 'New list' : 'Adds to existing list'}</p>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="top-row"><button class="back-btn" onclick="cancelImport()">${ICONS.chevronLeft} Cancel</button></div>
    <p class="section-title" style="margin-top:0;">Ready to import</p>
    ${rows}
    ${state.importSkipped ? `<p style="font-size:12.5px;color:var(--ink-soft);margin-top:10px;">${state.importSkipped} row${state.importSkipped===1?'':'s'} skipped (missing or unrecognized category, list name, or item name).</p>` : ''}
    <button class="primary" style="width:100%;justify-content:center;margin-top:20px;" onclick="applyImport()">Confirm import</button>
  `;
}

function attachHandlers(){
  const nameInput = document.getElementById('recipeNameInput');
  if(nameInput) nameInput.oninput = e => { state.formName = e.target.value; };

  const ingInput = document.getElementById('ingredientInput');
  if(ingInput) ingInput.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); addFormIngredient(); } };

  const adhocName = document.getElementById('adhocName');
  if(adhocName) adhocName.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); addAdhocItem(); } };

  const csvInput = document.getElementById('csvFileInput');
  if(csvInput) csvInput.onchange = handleCsvFile;
}

function openReview(recipeId){
  state.reviewRecipeId = recipeId;
  state.reviewSelections = {};
  go('review-recipe');
}

function toggleReviewItem(i){
  state.reviewSelections[i] = state.reviewSelections[i] === false ? true : false;
  render();
}

async function addReviewToList(){
  const recipe = state.recipes.find(r => r.id === state.reviewRecipeId);
  if(!recipe) return;
  recipe.ingredients.forEach((ing,i) => {
    const included = state.reviewSelections[i] !== false;
    if(!included) return;
    const already = state.list.some(it => it.name.toLowerCase() === ing.name.toLowerCase() && !it.checked);
    if(already) return;
    state.list.push({ id: uid(), name: ing.name, qtyText: formatQty(ing), category: recipe.category, checked:false, source:'recipe', recipeName: recipe.name });
  });
  await saveList();
  state.tab = 'grocery';
  go('list-home');
}

function editRecipe(recipeId){
  const recipe = state.recipes.find(r => r.id === recipeId);
  if(!recipe) return;
  go('recipe-form', { editingRecipeId: recipeId, formName: recipe.name, formIngredients: recipe.ingredients.map(i=>({...i})) });
}

function cancelRecipeForm(){
  go('recipe-list');
}

function addFormIngredient(){
  const input = document.getElementById('ingredientInput');
  const amountInput = document.getElementById('ingredientAmount');
  const unitSelect = document.getElementById('ingredientUnit');
  const val = input.value.trim();
  if(!val){
    input.style.borderColor = 'var(--berry)';
    input.focus();
    return;
  }
  state.formIngredients = state.formIngredients || [];
  state.formIngredients.push({
    name: val,
    amount: amountInput.value.trim(),
    unit: unitSelect.value
  });
  input.value = '';
  amountInput.value = '';
  unitSelect.value = '';
  render();
  document.getElementById('ingredientInput').focus();
}

function removeFormIngredient(i){
  state.formIngredients.splice(i,1);
  render();
}

async function saveRecipeForm(){
  const nameInput = document.getElementById('recipeNameInput');
  const name = (nameInput.value || '').trim();
  if(!name){
    nameInput.style.borderColor = 'var(--berry)';
    nameInput.focus();
    return;
  }
  const ingredients = state.formIngredients || [];
  if(state.editingRecipeId){
    const recipe = state.recipes.find(r => r.id === state.editingRecipeId);
    recipe.name = name;
    recipe.ingredients = ingredients;
  } else {
    state.recipes.push({ id: uid(), name, category: state.currentCategory, ingredients });
  }
  await saveRecipes();
  go('recipe-list');
}

function confirmDeleteRecipe(recipeId){
  state.deleteConfirmRecipeId = recipeId;
  render();
}

function closeDeleteRecipeModal(){
  state.deleteConfirmRecipeId = null;
  render();
}

async function deleteRecipe(recipeId){
  const wasEditing = state.editingRecipeId === recipeId;
  state.recipes = state.recipes.filter(r => r.id !== recipeId);
  state.deleteConfirmRecipeId = null;
  await saveRecipes();
  go('recipe-list');
}

async function addAdhocItem(){
  const nameInput = document.getElementById('adhocName');
  const catSelect = document.getElementById('adhocCategory');
  const name = nameInput.value.trim();
  if(!name){
    nameInput.style.borderColor = 'var(--berry)';
    nameInput.focus();
    return;
  }
  state.list.push({ id: uid(), name, category: catSelect.value, checked:false, source:'adhoc' });
  await saveList();
  render();
}

async function toggleListItem(id){
  const it = state.list.find(x => x.id === id);
  if(it) it.checked = !it.checked;
  await saveList();
  render();
}

async function removeListItem(id){
  state.list = state.list.filter(x => x.id !== id);
  await saveList();
  render();
}

async function clearChecked(){
  state.list = state.list.filter(x => !x.checked);
  await saveList();
  render();
}

function clearAllConfirm(){
  state.showClearAllModal = true;
  render();
}
function closeClearAllModal(){
  state.showClearAllModal = false;
  render();
}
async function clearAllList(){
  state.list = [];
  state.showClearAllModal = false;
  await saveList();
  render();
}

function triggerCsvFile(){
  const input = document.getElementById('csvFileInput');
  if(input) input.click();
}

function downloadTemplate(){
  const csv = [
    'category,list_name,item_name,amount,unit',
    'food,Chicken Piccata,chicken breast,2,lb',
    'food,Chicken Piccata,capers,2,tbsp',
    'food,Chicken Piccata,lemon,1,whole',
    'cleaning,Weekly Bathroom Clean,all-purpose cleaner,1,bottle',
    'cleaning,Weekly Bathroom Clean,paper towels,1,roll',
    'toiletries,Monthly Restock,shampoo,,',
    'toiletries,Monthly Restock,toothpaste,,'
  ].join('\n') + '\n';
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'thyme-to-shop-template.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}

function dismissImportSummary(){
  state.lastImportSummary = null;
  render();
}

function cancelImport(){
  state.importGroups = null;
  state.importError = null;
  state.importSkipped = 0;
  go('category-home');
}

async function handleCsvFile(e){
  const file = e.target.files[0];
  if(!file) return;
  let text;
  try{ text = await file.text(); }
  catch(err){
    state.importError = "Couldn't read that file. Please try again.";
    go('import-preview');
    return;
  }
  const rows = parseCSV(text);
  if(rows.length < 2){
    state.importError = 'That file has no data rows to import.';
    go('import-preview');
    return;
  }
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = {
    category: header.indexOf('category'),
    list_name: header.indexOf('list_name'),
    item_name: header.indexOf('item_name'),
    amount: header.indexOf('amount'),
    unit: header.indexOf('unit')
  };
  if(idx.category===-1 || idx.list_name===-1 || idx.item_name===-1){
    state.importError = 'Missing one or more required columns: category, list_name, item_name. Download the template to see the expected format.';
    go('import-preview');
    return;
  }

  const groupsMap = {};
  let skipped = 0;
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    const rawCat = row[idx.category] || '';
    const listName = (row[idx.list_name] || '').trim();
    const itemName = (row[idx.item_name] || '').trim();
    const amount = idx.amount>-1 ? (row[idx.amount] || '').trim() : '';
    const unitRaw = idx.unit>-1 ? (row[idx.unit] || '').trim().toLowerCase() : '';
    const category = normalizeCategory(rawCat);
    if(!category || !listName || !itemName){ skipped++; continue; }
    const unit = UNITS.some(u => u.id === unitRaw) ? unitRaw : '';
    const key = category + '|' + listName.toLowerCase();
    if(!groupsMap[key]) groupsMap[key] = { category, name: listName, items: [] };
    groupsMap[key].items.push({ name: itemName, amount, unit });
  }

  const groups = Object.values(groupsMap);
  groups.forEach(g => {
    const existing = state.recipes.find(r => r.category === g.category && r.name.toLowerCase() === g.name.toLowerCase());
    g.isNew = !existing;
    g.existingId = existing ? existing.id : null;
  });

  e.target.value = '';

  if(groups.length === 0){
    state.importError = 'No valid rows were found in that file. Check that category, list_name, and item_name are filled in for each row.';
    go('import-preview');
    return;
  }

  state.importGroups = groups;
  state.importSkipped = skipped;
  state.importError = null;
  go('import-preview');
}

async function applyImport(){
  let listsAdded = 0, listsUpdated = 0, itemsAdded = 0;
  (state.importGroups || []).forEach(g => {
    if(g.existingId){
      const recipe = state.recipes.find(r => r.id === g.existingId);
      let added = 0;
      g.items.forEach(it => {
        const dup = recipe.ingredients.some(x => x.name.toLowerCase() === it.name.toLowerCase());
        if(!dup){ recipe.ingredients.push(it); added++; }
      });
      if(added > 0) listsUpdated++;
      itemsAdded += added;
    } else {
      state.recipes.push({ id: uid(), name: g.name, category: g.category, ingredients: g.items });
      listsAdded++;
      itemsAdded += g.items.length;
    }
  });
  await saveRecipes();
  const parts = [];
  if(listsAdded) parts.push(`${listsAdded} new list${listsAdded===1?'':'s'}`);
  if(listsUpdated) parts.push(`${listsUpdated} existing list${listsUpdated===1?'':'s'} updated`);
  let summary = parts.length ? parts.join(', ') : 'Nothing new';
  summary += ` — ${itemsAdded} item${itemsAdded===1?'':'s'} added`;
  if(state.importSkipped) summary += `, ${state.importSkipped} row${state.importSkipped===1?'':'s'} skipped`;
  summary += '.';
  state.lastImportSummary = summary;
  state.importGroups = null;
  state.importSkipped = 0;
  state.importError = null;
  go('category-home');
}

loadData();
</script>
